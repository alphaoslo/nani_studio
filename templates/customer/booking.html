{% extends 'layouts/base.html' %}
{% block title %}Book Now — Nani Digitals{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <h1 class="fw-bold mb-4 text-center">Book a Session</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form method="POST" action="{{ url_for('booking.index') }}" class="card p-4 shadow-sm border-0">
                    <div class="row g-3">
                        <div class="col-md-6"><input type="text" name="customer_name" class="form-control" placeholder="Customer Name" required></div>
                        <div class="col-md-6"><input type="tel" name="phone" class="form-control" placeholder="Phone Number" required></div>
                        <div class="col-md-6"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
                        <div class="col-md-6">
                            <select name="service" class="form-select" required>
                                <option value="">Select Service</option>
                                <option>Traditional camera</option>
                                <option>Traditional video</option>
                                <option>CANDID WEDDING</option>
                                <option>CINEMATIC VIDEO</option>
                                <option>Drone</option>
                                <option>LED SCREEN (TV)</option>
                                <option>Photo & video editing</option>
                            </select>
                        </div>
                        <div class="col-md-6"><input type="date" name="event_date" class="form-control" required></div>
                        <div class="col-md-6">
                            <select name="event_type" class="form-select" required>
                                <option value="">Event Type</option>
                                <option>Engagement</option>
                                <option>Pre wedding shoot (song)</option>
                                <option>Wedding</option>
                                <option>Birthday party</option>
                                <option>Post wedding shoot</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Select Package (optional)</label>
                            <select name="package" class="form-select">
                                <option value="">Choose a package</option>
                                <option>PACKAGE 1: SILVER — Total: 40,000/- (1 Traditional Camera, 1 Traditional Video, 12x36 Album 40 to 45 sheets)</option>
                                <option>PACKAGE 2: BOTH (GIRL & BOY) — Total: 60,000/- (2 Traditional Cameras, 2 Traditional Videos, 12x36 Album 45 to 50 sheets)</option>
                                <option>PACKAGE 3: PREMIUM — Total: 1,00,000/- (2 Traditional Cameras, 2 Traditional Videos, 1 Drone, 2x 12x36 Albums 60 to 65 sheets, Post Wedding Photos, 2 Photo Calendars, 2 Photo Frames)</option>
                                <option>PACKAGE 4: DELUXE — Total: 1,40,000/- (1 Traditional Camera, 1 Traditional Video, 1 Candid Camera, 1 Cinematic Video, 2x 12x36 Albums, 2 Photo Frames, 2 Photo Calendars, 1 Drone, 1 WhatsApp Invitation)</option>
                                <option>PACKAGE 5: ELITE — Total: 1,70,000/- (Pre-wedding shoot 1 song, 1 Traditional Camera, 1 Traditional Video, 1 Candid Camera, 1 Cinematic Video, 2x 12x36 Albums, 2 Photo Frames, 2 Photo Calendars, 1 Drone, 1 LED SCREEN, 1 WhatsApp Invitation)</option>
                                <option>PACKAGE 6: ULTIMATE — Total: 2,00,000/- (Pre-Wedding Shoot 1 song, 1 Traditional Camera, 1 Traditional Video, 1 Candid Camera, 1 Cinematic Video, 1 Audience video, 2x LED TV (6x8), 1 Drone, 2x 12x36 Albums, 2 Photo Frames, 2 Photo Calendars, 1 WhatsApp Invitation, Wedding Highlights video, 1x 64GB pen drive)</option>
                            </select>
                        </div>
                        <div class="col-12"><input type="text" name="location" class="form-control" placeholder="Event Location" required></div>
                        <div class="col-12"><textarea name="message" class="form-control" rows="4" placeholder="Message (optional)"></textarea></div>
                        <div class="col-12"><button type="submit" class="btn btn-warning w-100">Submit Booking</button></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
