{% extends 'layouts/base.html' %}
{% block title %}Contact — Nani Digitals{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <h1 class="fw-bold mb-4 text-center">Contact Us</h1>
        <div class="row">
            <div class="col-md-5 mb-4">
                <h4 class="text-warning">Get in Touch</h4>
                <p class="mb-1"><i class="bi bi-telephone"></i> <a href="tel:9063939145" class="text-dark text-decoration-none">9063939145</a></p>
                <p class="mb-1"><i class="bi bi-telephone"></i> <a href="tel:9492283898" class="text-dark text-decoration-none">9492283898</a></p>
                <p class="mb-1"><i class="bi bi-geo-alt"></i> Mydukur</p>
                <p class="mb-4"><i class="bi bi-instagram"></i> @nani_reelz</p>
                <a href="tel:9063939145" class="btn btn-warning me-2">Call Now</a>
                <a href="https://instagram.com/nani_reelz" target="_blank" class="btn btn-outline-dark">Instagram</a>
            </div>
            <div class="col-md-7">
                <form method="POST" action="{{ url_for('contact.index') }}" class="card p-4 shadow-sm border-0">
                    <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="Your Name" required></div>
                    <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="Phone Number" required></div>
                    <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
                    <div class="mb-3"><input type="text" name="subject" class="form-control" placeholder="Subject"></div>
                    <div class="mb-3"><textarea name="message" class="form-control" rows="4" placeholder="Your Message" required></textarea></div>
                    <button type="submit" class="btn btn-warning">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
