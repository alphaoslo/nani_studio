{% extends 'layouts/base.html' %}
{% block title %}Services — Nani Digitals{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <h1 class="fw-bold mb-4 text-center">Our Services</h1>
        {% for category, items in categories.items() %}
        <h3 class="text-warning fw-bold mt-4 mb-3">{{ category }}</h3>
        <div class="row g-4">
            {% for s in items %}
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4 h-100 service-card">
                    <i class="bi {{ s.icon }} text-warning fs-1 mb-3"></i>
                    <h5 class="fw-bold">{{ s.name }}</h5>
                    <p class="text-muted">{{ s.description }}</p>
                    <a href="{{ url_for('booking.index') }}" class="btn btn-outline-warning btn-sm mt-auto">Book Now</a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
