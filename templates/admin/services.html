{% extends 'layouts/base.html' %}
{% block title %}Manage Services — Nani Digitals{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <h2 class="fw-bold mb-4">Services</h2>
        <button class="btn btn-warning mb-3" data-bs-toggle="collapse" data-bs-target="#addForm">Add Service</button>
        <div class="collapse" id="addForm">
            <form method="POST" action="{{ url_for('admin.add_service') }}" class="card p-3 mb-4 border-0 shadow-sm">
                <div class="row g-3">
                    <div class="col-md-4"><input type="text" name="name" class="form-control" placeholder="Name" required></div>
                    <div class="col-md-4"><input type="text" name="category" class="form-control" placeholder="Category" required></div>
                    <div class="col-md-4"><input type="text" name="icon" class="form-control" placeholder="Icon (e.g. bi-camera)" value="bi-camera"></div>
                    <div class="col-12"><textarea name="description" class="form-control" placeholder="Description" required></textarea></div>
                    <div class="col-12"><button type="submit" class="btn btn-warning">Add</button></div>
                </div>
            </form>
        </div>
        <table class="table table-hover">
            <thead><tr><th>Name</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
                {% for s in services %}
                <tr>
                    <td>{{ s.name }}</td>
                    <td>{{ s.category }}</td>
                    <td>{{ 'Active' if s.active else 'Inactive' }}</td>
                    <td>
                        <form method="POST" action="{{ url_for('admin.delete_service', id=s.id) }}" style="display:inline;" onsubmit="return confirm('Delete?')">
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
